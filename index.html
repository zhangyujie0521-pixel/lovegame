<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Love Game</title>
  <style>
    body { margin: 0; padding: 0; background: #ffebee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    h1 { color: #d81b60; margin-bottom: 10px; }
    #score-board { font-size: 20px; color: #880e4f; margin-bottom: 20px; }
    #heart { font-size: 80px; cursor: pointer; user-select: none; transition: transform 0.1s; }
    #heart:active { transform: scale(1.3); }
    .tip { font-size: 14px; color: #ad1457; margin-top: 15px; }
  </style>
</head>
<body>
  <h1>Love Game</h1>
  <div id="score-board">爱心值: <span id="score">0</span></div>
  <div id="heart">❤️</div>
  <div class="tip">轻触爱心收集爱心值</div>
  <script>
    let score = 0;
    const scoreEl = document.getElementById('score');
    const heart = document.getElementById('heart');
    heart.addEventListener('pointerdown', () => {
      score += 1;
      scoreEl.textContent = score;
    });
  </script>
</body>
</html>
